<form [formGroup]="listForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="Id">ID</label>
    <input type="number" id="Id" name="Id" formControlName="Id" required appAutoFocus/>
  </div>
  <div class="form-group">
    <label for="Name">Name</label>
    <input type="text" id="Name" formControlName="Name" required />
  </div>
  <div class="form-group">
    <label for="Price">Price</label>
    <input type="number" id="Price" formControlName="Price" required />
  </div>
  <div class="form-group">
    <label for="Category">Category</label>
    <input type="text" id="Category" formControlName="Category" />
  </div>
  <div class="form-group">
    <label for="Quantity">Quantity</label>
    <input type="number" id="Quantity" formControlName="Quantity" />
  </div>
  <div class="form-group">
    <label for="Description">Description</label>
    <textarea id="Description" formControlName="Description"></textarea>
  </div>

  <button type="submit">Submit</button>

  <button type="button" (click)="onDelete()">Delete</button>

  <button type="button" routerLink="/restaurant-menu-list" routerLinkActive="active">Back to Menu</button>

</form>
