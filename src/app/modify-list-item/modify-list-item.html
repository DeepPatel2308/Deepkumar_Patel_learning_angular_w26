<form [formGroup]="listForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" name="id" formControlName="id" required />
  </div>
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" formControlName="name" required />
  </div>
  <div class="form-group">
    <label for="price">Price</label>
    <input type="number" id="price" formControlName="price" required />
  </div>
  <div class="form-group">
    <label for="category">Category</label>
    <input type="text" id="category" formControlName="category" />
  </div>
  <div class="form-group">
    <label for="quantity">Quantity</label>
    <input type="number" id="quantity" formControlName="quantity" />
  </div>
  <div class="form-group">
    <label for="description">Description</label>
    <textarea id="Description" formControlName="Description"></textarea>
  </div>

  <button type="submit">Submit</button>

  <button type="button" (click)="onDelete()">Delete</button>

  <button type="button" (click)="navigator">Back to Menu</button>

</form>
