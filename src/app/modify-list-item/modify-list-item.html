<form [formGroup]="listForm" (ngSubmit)="onSubmit()" class="mat-form">

  <mat-form-field appearance="outline" class="formField" disabled>
    <mat-label>ID</mat-label>
    <input matInput="number" formControlName="Id" appAutoFocus/>
  </mat-form-field >

   <mat-form-field appearance="outline" class="formField">
    <mat-label>Name</mat-label>
    <input matInput="text" formControlName="Name" required />
   </mat-form-field>

    <div class="form-group">
    <label for="Price">Price</label>
    <input matInput="number" id="Price" formControlName="Price" required />
    </div>
  <mat-form-field appearance="outline" class="formField">
    <mat-label>Category</mat-label>
    <input matInput type="text" formControlName="Category" />
  </mat-form-field>
  <div class="form-group">
    <label for="Quantity">Quantity</label>
    <input type="number" id="Quantity" formControlName="Quantity" />
  </div>
  <div class="form-group">
    <label for="Description">Description</label>
    <textarea id="Description" formControlName="Description"></textarea>
  </div>

  <div class="button">
    <button mat-raised-button color="primary" type="submit" [appDisableButton]="listForm">Submit</button>
    <button mat-raised-button color="warn" type="button" (click)="onDelete()">Delete</button>
    <button mat-button type="button" (click)="lists">Back to Menu</button>
  </div>

    <div *ngIf="error" class="error mat-error">{{ error }}</div>

</form>
