<br><div *ngFor="let item of menuList" class="menu-item">
  <p align="center"><strong>{{ item | nameCategory }}</strong> - {{ item.Price | currency: 'CAD': "symbol-narrow"}}<br>
    Category: {{item.Category | uppercase}}<br>
  Description: {{item.Description}}<br>
  Added On: {{item.Date | date}}
  </p>
  <div align="center">
  <button routerLink='/modify-menu' style="margin-right: 10px;">Edit</button>
  <button (click)="onDelete(item.Id)">X</button><br><br><br>
  </div>
</div>

<br>
<div align="center">
<button routerLink="/modify-menu">Add New Item</button>
</div>
