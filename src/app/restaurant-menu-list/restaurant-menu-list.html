<div class="mat-container">
  <h2>Menu</h2>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let item">{{ item.id }}</td>
    </ng-container>

    <ng-container matColumnDef="nameCategory">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let item">{{ item | nameCategory }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let item">{{ item.Price | currency: 'CAD': 'symbol-narrow' }}</td>
    </ng-container>

    <ng-container matColumnDef="addOn">
      <th mat-header-cell *matHeaderCellDef>Add On</th>
      <td mat-cell *matCellDef="let item">{{ item.Date | date }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let item">{{ item.Description }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let item; columns: displayedColumns"
      [routerLink]="['/modify-menu', item.Id]"
      [appHoverHighlight]="'lightgrey'">
    </tr>
  </table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>

  <div *ngIf="error" class="error mat-error">{{ error }}</div>

</div>
