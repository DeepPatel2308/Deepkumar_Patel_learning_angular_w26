<h2>Restaurant Menu</h2>

<div *ngFor="let item of menuList" class="menu-item">
  <p><strong>{{ item.Id }}</strong> — {{ item.Name }} ({{ item.Price }})</p>

  <button routerLink='/modify-menu'>Edit</button>
  <button (click)="onDelete(item.Id)">Delete</button>
</div>

<br>

<button routerLink="/modify-menu">Add New Item</button>
